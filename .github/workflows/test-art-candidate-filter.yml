name: Test Art Candidate Filter

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/collect_remaining_art_commissions.js
          node --check scripts/test_art_candidate_filter.js

      - name: Test art candidate filter
        run: node scripts/test_art_candidate_filter.js
