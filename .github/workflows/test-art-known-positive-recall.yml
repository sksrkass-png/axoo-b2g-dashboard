name: Test Art Collector Safety

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector-safety-test:
    runs-on: ubuntu-24.04

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Show environment
        run: |
          echo ""
          echo "===================================="
          echo "AXOO ART COLLECTOR SAFETY TEST"
          echo "===================================="
          node --version
          echo "===================================="
          echo ""

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/art_region_scope.js
          node --check scripts/art_commission_sources.js
          node --check scripts/art_source_adapters.js
          node --check scripts/collect_remaining_art_commissions.js
          node --check scripts/test_art_known_positive_recall.js
          node --check scripts/test_art_region_inference.js

      - name: Run known-positive recall test
        run: |
          echo ""
          echo "===================================="
          echo "1/2 KNOWN-POSITIVE RECALL TEST"
          echo "===================================="
          echo ""

          node scripts/test_art_known_positive_recall.js

      - name: Run region inference regression test
        run: |
          echo ""
          echo "===================================="
          echo "2/2 REGION INFERENCE TEST"
          echo "===================================="
          echo ""

          node scripts/test_art_region_inference.js

      - name: Safety test summary
        run: |
          echo ""
          echo "===================================="
          echo "AXOO ART COLLECTOR SAFETY"
          echo "===================================="
          echo "KNOWN-POSITIVE RECALL : PASS"
          echo "REGION INFERENCE      : PASS"
          echo "===================================="
          echo ""
          echo "✅ ART COLLECTOR SAFETY TEST PASSED"
