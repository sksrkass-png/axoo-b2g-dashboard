name: Apply Permanent Art Notice Exclusions

on:
  push:
    branches: [main]
    paths:
      - "data/art_commission_exclusions.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: axoo-dashboard-data-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate permanent exclusion filter
        run: |
          node --check scripts/filter_art_commission_results.js
          node --check scripts/art_housing_scope.js
          node scripts/test_art_housing_scope.js
      - name: Purge excluded notices from LIVE and ARCHIVE
        run: node scripts/filter_art_commission_results.js
      - name: Commit and publish cleaned data
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/art_commissions.json data/art_commissions_archive.json; then
            echo "No excluded notices remain in the published dataset."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art_commissions.json data/art_commissions_archive.json
          git commit -m "Permanently purge manually excluded art notices"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
