name: Normalize Art Commission Dates

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/art_commissions.json"
      - "scripts/normalize_art_dates.js"

permissions:
  contents: write

jobs:
  normalize-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize art commission dates
        run: node scripts/normalize_art_dates.js

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/art_commissions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit normalized dates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/art_commissions.json
          git commit -m "Normalize art commission dates"
          git push
