name: Normalize Art Commission Dates

on:
  # 날짜 정규화만 따로 점검하고 싶을 때 수동 실행.
  # 자동 수집 워크플로 안에서 normalize_art_dates.js를 이미 실행하므로
  # main push 자동 트리거는 사용하지 않는다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-art-commission-dates
  cancel-in-progress: false

jobs:
  normalize-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate normalizer syntax
        run: node --check scripts/normalize_art_dates.js

      - name: Normalize art commission dates
        run: node scripts/normalize_art_dates.js

      - name: Check changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            data/art_commissions.json \
            data/art_commissions_archive.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit normalized dates and archive
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_commissions.json \
            data/art_commissions_archive.json

          git commit \
            -m "Normalize art dates and update archive"

          git pull --rebase origin main

          git push origin HEAD:main
