name: Auto Extract Art Notice Documents

on:
  workflow_dispatch:

  schedule:
    # 5분마다 자동 확인
    - cron: "*/5 * * * *"


permissions:
  contents: write


concurrency:
  group: auto-extract-art-notices
  cancel-in-progress: false


jobs:

  auto-extract:

    runs-on: ubuntu-latest


    env:

      AXOO_BRIDGE_URL: ${{ secrets.AXOO_BRIDGE_URL }}

      AXOO_BRIDGE_TOKEN: ${{ secrets.AXOO_BRIDGE_TOKEN }}


    steps:


      # ======================================================
      # SETUP
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "24"


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf


      # ======================================================
      # STEP 1
      # Project Control
      # → File Bridge
      # → 자동 분석 Queue 생성
      # ======================================================

      - name: Find projects requiring analysis
        run: |
          node scripts/find_art_notice_analysis_queue.js


      # ======================================================
      # Queue 확인
      # ======================================================

      - name: Show analysis queue
        shell: bash

        run: |

          set -euo pipefail

          QUEUE_FILE=".tmp/art_notice_analysis_queue.json"


          if [ ! -f "$QUEUE_FILE" ]; then

            echo "Queue file not found"

            exit 1

          fi


          echo ""
          echo "========================================"
          echo "AXOO AUTO ANALYSIS QUEUE"
          echo "========================================"


          jq . "$QUEUE_FILE"


          echo "========================================"


      # ======================================================
      # STEP 2
      # Queue 안의 프로젝트를 순차 자동 분석
      # ======================================================

      - name: Extract and analyze queued notices
        id: process
        shell: bash

        run: |

          set -euo pipefail


          QUEUE_FILE=".tmp/art_notice_analysis_queue.json"


          QUEUE_COUNT="$(
            jq -r '.queueCount // 0' "$QUEUE_FILE"
          )"


          echo ""
          echo "Queue count: $QUEUE_COUNT"
          echo ""


          if [ "$QUEUE_COUNT" = "0" ]; then

            echo "processed=false" \
              >> "$GITHUB_OUTPUT"

            echo "분석이 필요한 프로젝트가 없습니다."

            exit 0

          fi


          echo "processed=true" \
            >> "$GITHUB_OUTPUT"


          jq -r \
            '.queue[].researchId' \
            "$QUEUE_FILE" \
          | while read -r research_id
          do


            if [ -z "$research_id" ]; then

              continue

            fi


            export ART_NOTICE_ID="$research_id"


            echo ""
            echo "========================================"
            echo "AUTO ANALYSIS START"
            echo "Research ID: $ART_NOTICE_ID"
            echo "========================================"


            # --------------------------------------------------
            # Google Drive
            # → Apps Script Bridge
            # → HWP / HWPX / PDF
            # --------------------------------------------------

            node scripts/extract_art_notice_attachments.js


            # --------------------------------------------------
            # HWP / HWPX / PDF
            # → Raw Text
            # --------------------------------------------------

            python scripts/extract_art_notice_text.py


            # --------------------------------------------------
            # file:// 런타임 URL 제거
            # --------------------------------------------------

            python - <<'PY'
          import json
          import os
          from pathlib import Path


          research_id = os.environ["ART_NOTICE_ID"]


          path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )


          if not path.exists():

              raise SystemExit(
                  f"Result not found: {path}"
              )


          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          data["source"] = (
              "apps_script_bridge"
          )

          data["sourceUrl"] = ""


          for doc in data.get(
              "documents",
              []
          ):

              doc.pop(
                  "url",
                  None
              )

              doc["source"] = (
                  "apps_script_bridge"
              )


          path.write_text(

              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
              +
              "\n",

              encoding="utf-8"
          )
          PY


            # --------------------------------------------------
            # Raw Text
            # → Structured Notice Analysis
            # --------------------------------------------------

            python scripts/build_art_notice_analysis.py


            # --------------------------------------------------
            # Raw Text
            # → AXOO Participation Analysis
            # --------------------------------------------------

            python scripts/build_art_participation_analysis.py


            # --------------------------------------------------
            # 결과 검증
            # --------------------------------------------------

            python - <<'PY'
          import json
          import os
          from pathlib import Path


          research_id = os.environ["ART_NOTICE_ID"]


          text_path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )


          analysis_path = (
              Path("data")
              / "art_notice_analysis"
              / f"{research_id}.json"
          )


          participation_path = (
              Path("data")
              / "art_participation_analysis"
              / f"{research_id}.json"
          )


          # ================================================
          # RAW TEXT
          # ================================================

          if not text_path.exists():

              raise SystemExit(
                  f"Text result missing: {text_path}"
              )


          text_data = json.loads(

              text_path.read_text(
                  encoding="utf-8"
              )
          )


          document_count = int(

              text_data.get(
                  "documentCount"
              )
              or
              0
          )


          success_count = int(

              text_data.get(
                  "successCount"
              )
              or
              0
          )


          if document_count < 1:

              raise SystemExit(
                  "No documents processed"
              )


          if (
              success_count
              !=
              document_count
          ):

              raise SystemExit(

                  "Document extraction incomplete: "
                  f"{success_count}/"
                  f"{document_count}"
              )


          # ================================================
          # STRUCTURED NOTICE ANALYSIS
          # ================================================

          if not analysis_path.exists():

              raise SystemExit(
                  f"Analysis result missing: {analysis_path}"
              )


          analysis_data = json.loads(

              analysis_path.read_text(
                  encoding="utf-8"
              )
          )


          if (
              analysis_data.get(
                  "status"
              )
              !=
              "ok"
          ):

              raise SystemExit(
                  "Analysis status is not OK"
              )


          summary = (

              analysis_data.get(
                  "analysisSummary",
                  {}
              )
          )


          found_count = int(

              summary.get(
                  "foundCount"
              )
              or
              0
          )


          field_count = int(

              summary.get(
                  "fieldCount"
              )
              or
              0
          )


          if found_count < 1:

              raise SystemExit(
                  "No structured values detected"
              )


          # ================================================
          # AXOO PARTICIPATION ANALYSIS
          # ================================================

          if not participation_path.exists():

              raise SystemExit(

                  "Participation result missing: "
                  f"{participation_path}"
              )


          participation_data = json.loads(

              participation_path.read_text(
                  encoding="utf-8"
              )
          )


          if (
              participation_data.get(
                  "status"
              )
              !=
              "ok"
          ):

              raise SystemExit(
                  "Participation status is not OK"
              )


          participation = (

              participation_data.get(
                  "participation",
                  {}
              )
          )


          required_participation_fields = [

              "applicant_type",
              "axoo_entry_mode",
              "primary_axoo_entry_mode",
              "proxy_submission",
              "proxy_scope",
              "power_of_attorney",
              "joint_application",
              "joint_allowed_parties",
              "production_company_joint",
              "participation_evidence",
              "participation_confidence",
              "entry_sort_priority"
          ]


          missing_fields = [

              key

              for key
              in required_participation_fields

              if key
              not in
              participation
          ]


          if missing_fields:

              raise SystemExit(

                  "Missing participation fields: "
                  +
                  ", ".join(
                      missing_fields
                  )
              )


          primary_mode = (

              participation.get(
                  "primary_axoo_entry_mode",
                  "CHECK"
              )
          )


          confidence = (

              participation.get(
                  "participation_confidence",
                  "LOW"
              )
          )


          # ================================================
          # SUMMARY
          # ================================================

          print("")
          print(
              "========================================"
          )

          print(
              "AUTO ANALYSIS COMPLETE"
          )

          print(
              "Research ID:",
              research_id
          )

          print(
              "Documents:",
              document_count
          )

          print(
              "Notice fields:",
              found_count,
              "/",
              field_count
          )

          print(
              "AXOO entry mode:",
              primary_mode
          )

          print(
              "Participation confidence:",
              confidence
          )

          print(
              "========================================"
          )
          PY


            echo ""
            echo "COMPLETE: $ART_NOTICE_ID"
            echo ""


          done


      # ======================================================
      # STEP 3
      # 신규 분석이 있었을 때만
      # Dashboard용 Participation Index 재생성
      # ======================================================

      - name: Rebuild participation index
        if: steps.process.outputs.processed == 'true'
        shell: bash

        run: |

          set -euo pipefail


          echo ""
          echo "========================================"
          echo "REBUILD AXOO PARTICIPATION INDEX"
          echo "========================================"


          python \
            scripts/build_art_participation_index.py


          if [ ! -f \
            data/art_participation_index.json
          ]; then

            echo "Participation index missing"

            exit 1

          fi


          echo ""
          echo "Participation index rebuilt."
          echo ""


      # ======================================================
      # STEP 4
      # Index 검증
      # ======================================================

      - name: Validate participation index
        if: steps.process.outputs.processed == 'true'
        shell: bash

        run: |

          set -euo pipefail


          python - <<'PY'
          import json
          from pathlib import Path


          path = Path(
              "data/art_participation_index.json"
          )


          if not path.exists():

              raise SystemExit(
                  "Participation index not found"
              )


          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )


          required = [
              "version",
              "schemaVersion",
              "generatedAt",
              "sourceCount",
              "researchIdCount",
              "titleGroupCount",
              "conflictCount",
              "modeCounts",
              "byResearchId",
              "byTitle"
          ]


          missing = [
              key
              for key
              in required
              if key
              not in data
          ]


          if missing:

              raise SystemExit(
                  "Index missing fields: "
                  +
                  ", ".join(
                      missing
                  )
              )


          source_count = int(
              data.get(
                  "sourceCount",
                  0
              )
          )


          research_count = int(
              data.get(
                  "researchIdCount",
                  0
              )
          )


          if source_count < 1:

              raise SystemExit(
                  "Invalid sourceCount"
              )


          if (
              source_count
              !=
              research_count
          ):

              raise SystemExit(
                  "sourceCount / researchIdCount mismatch"
              )


          print("")
          print(
              "========================================"
          )

          print(
              "✅ PARTICIPATION INDEX VALID"
          )

          print(
              "Source count:",
              source_count
          )

          print(
              "Title groups:",
              data.get(
                  "titleGroupCount"
              )
          )

          print(
              "Conflicts:",
              data.get(
                  "conflictCount"
              )
          )

          print(
              "Mode counts:",
              json.dumps(
                  data.get(
                      "modeCounts",
                      {}
                  ),
                  ensure_ascii=False
              )
          )

          print(
              "========================================"
          )
          PY


      # ======================================================
      # Runtime 파일 정리
      # ======================================================

      - name: Cleanup runtime files
        if: always()
        shell: bash

        run: |

          rm -rf .tmp


          if git ls-files \
            --error-unmatch \
            data/art_notice_attachments.json \
            >/dev/null 2>&1
          then

            git restore \
              data/art_notice_attachments.json

          else

            rm -f \
              data/art_notice_attachments.json

          fi


      # ======================================================
      # 변경 확인
      # ======================================================

      - name: Check generated data
        id: changes
        shell: bash

        run: |

          if [ -n "$(
            git status \
              --porcelain \
              -- \
              data/art_notice_text \
              data/art_notice_analysis \
              data/art_participation_analysis \
              data/art_participation_index.json
          )" ]
          then

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # 결과 Commit
      # ======================================================

      - name: Commit automatic notice analysis
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |

          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/art_notice_text \
            data/art_notice_analysis \
            data/art_participation_analysis \
            data/art_participation_index.json


          git commit \
            -m "Auto extract and analyze art notices"


          git pull \
            --rebase \
            origin \
            main


          git push
