name: Extract Art Notice Documents

on:
  workflow_dispatch:
    inputs:
      research_id:
        description: "테스트할 공고 Research ID"
        required: true
        default: "external-10a9592b4d5eec3a"

permissions:
  contents: write

concurrency:
  group: extract-art-notices
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      ART_NOTICE_ID: ${{ inputs.research_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf

      - name: Collect notice attachments
        run: |
          node scripts/extract_art_notice_attachments.js

      - name: Extract document text
        run: |
          python scripts/extract_art_notice_text.py

      - name: Validate extraction result
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          attachment_path = Path(
              "data/art_notice_attachments.json"
          )

          text_path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          attachments = json.loads(
              attachment_path.read_text(
                  encoding="utf-8"
              )
          )

          target = next(
              (
                  item
                  for item in attachments
                  if item.get("researchId")
                  == research_id
              ),
              None
          )

          if not target:
              raise SystemExit(
                  "Attachment result missing"
              )

          if target.get("status") != "ok":
              raise SystemExit(
                  "Attachment extraction failed: "
                  + str(
                      target.get("status")
                  )
                  + " / "
                  + str(
                      target.get("error", "")
                  )
              )

          if not target.get("attachments"):
              raise SystemExit(
                  "No attachments found"
              )

          if not text_path.exists():
              raise SystemExit(
                  f"Result file not found: {text_path}"
              )

          data = json.loads(
              text_path.read_text(
                  encoding="utf-8"
              )
          )

          document_count = int(
              data.get("documentCount") or 0
          )

          success_count = int(
              data.get("successCount") or 0
          )

          print("")
          print("========================================")
          print("AXOO ART NOTICE EXTRACTION RESULT")
          print("========================================")
          print("Research ID:", data.get("researchId"))
          print("Title:", data.get("title"))
          print("Status:", data.get("status"))
          print("Documents:", document_count)
          print("Success:", success_count)
          print("")

          for doc in data.get("documents", []):
              print(
                  "-",
                  doc.get("name"),
                  "|",
                  doc.get("status"),
                  "|",
                  doc.get("textLength"),
                  "chars"
              )

          if document_count < 1:
              raise SystemExit(
                  "No documents were processed"
              )

          if success_count != document_count:
              raise SystemExit(
                  f"Text extraction incomplete: "
                  f"{success_count}/{document_count}"
              )

          print("========================================")
          PY

      - name: Check generated files
        id: changes
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- \
            data/art_notice_attachments.json \
            data/art_notice_text)" ]; then

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi

      - name: Commit extracted notice data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_notice_attachments.json \
            data/art_notice_text

          git commit \
            -m "Extract art notice documents"

          git push
