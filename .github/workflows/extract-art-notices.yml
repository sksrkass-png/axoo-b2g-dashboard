name: Extract Art Notice Documents

on:
  workflow_dispatch:
    inputs:
      research_id:
        description: "테스트할 공고 Research ID"
        required: true
        default: "external-10a9592b4d5eec3a"

permissions:
  contents: write

concurrency:
  group: extract-art-notices
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      ART_NOTICE_ID: ${{ inputs.research_id }}

      AXOO_BRIDGE_URL: ${{ secrets.AXOO_BRIDGE_URL }}

      AXOO_BRIDGE_TOKEN: ${{ secrets.AXOO_BRIDGE_TOKEN }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "24"


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf


      # ======================================================
      # Google Drive
      # → Apps Script Bridge
      # → 임시 HWP/HWPX/PDF 다운로드
      # ======================================================

      - name: Download notice files from Drive Bridge
        run: |
          node scripts/extract_art_notice_attachments.js


      # ======================================================
      # HWP / HWPX / PDF
      # → Text
      # ======================================================

      - name: Extract document text
        run: |
          python scripts/extract_art_notice_text.py


      # ======================================================
      # GitHub Runner의 file:// 임시 경로 제거
      # ======================================================

      - name: Sanitize extracted JSON
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Result not found: {path}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          data["source"] = (
              "apps_script_bridge"
          )

          data["sourceUrl"] = ""

          for doc in data.get(
              "documents",
              []
          ):
              doc.pop(
                  "url",
                  None
              )

              doc["source"] = (
                  "apps_script_bridge"
              )

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY


      # ======================================================
      # 실제 성공 여부 검증
      # ======================================================

      - name: Validate extraction result
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          attachment_path = Path(
              "data/art_notice_attachments.json"
          )

          text_path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          attachments = json.loads(
              attachment_path.read_text(
                  encoding="utf-8"
              )
          )

          target = next(
              (
                  item
                  for item in attachments
                  if item.get(
                      "researchId"
                  ) == research_id
              ),
              None
          )

          if not target:
              raise SystemExit(
                  "Bridge attachment result missing"
              )

          if (
              target.get("status")
              != "ok"
          ):
              raise SystemExit(
                  "Bridge download failed"
              )

          attachment_count = len(
              target.get(
                  "attachments",
                  []
              )
          )

          if attachment_count < 1:
              raise SystemExit(
                  "No notice files received"
              )

          if not text_path.exists():
              raise SystemExit(
                  f"Result file not found: "
                  f"{text_path}"
              )

          data = json.loads(
              text_path.read_text(
                  encoding="utf-8"
              )
          )

          document_count = int(
              data.get(
                  "documentCount"
              ) or 0
          )

          success_count = int(
              data.get(
                  "successCount"
              ) or 0
          )

          print("")
          print(
              "========================================"
          )
          print(
              "AXOO DRIVE BRIDGE EXTRACTION RESULT"
          )
          print(
              "========================================"
          )

          print(
              "Research ID:",
              data.get(
                  "researchId"
              )
          )

          print(
              "Title:",
              data.get(
                  "title"
              )
          )

          print(
              "Bridge files:",
              attachment_count
          )

          print(
              "Documents:",
              document_count
          )

          print(
              "Success:",
              success_count
          )

          print("")

          for doc in data.get(
              "documents",
              []
          ):
              print(
                  "-",
                  doc.get(
                      "name"
                  ),
                  "|",
                  doc.get(
                      "status"
                  ),
                  "|",
                  doc.get(
                      "textLength"
                  ),
                  "chars"
              )

          if document_count < 1:
              raise SystemExit(
                  "No documents processed"
              )

          if (
              success_count !=
              document_count
          ):
              raise SystemExit(
                  f"Text extraction incomplete: "
                  f"{success_count}/"
                  f"{document_count}"
              )

          print(
              "========================================"
          )
          PY


      # ======================================================
      # 임시 HWP + runtime manifest 제거
      #
      # 원본 HWP 바이너리는 GitHub에 저장하지 않는다.
      # ======================================================

      - name: Cleanup runtime files
        if: always()
        shell: bash

        run: |
          rm -rf .tmp

          git restore \
            data/art_notice_attachments.json \
            2>/dev/null || true


      # ======================================================
      # Text JSON만 Commit
      # ======================================================

      - name: Check generated text
        id: changes
        shell: bash

        run: |
          if [ -n "$(git status --porcelain -- \
            data/art_notice_text)" ]; then

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


      - name: Commit extracted notice text
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_notice_text

          git commit \
            -m "Extract art notice text via Drive bridge"

          git push
