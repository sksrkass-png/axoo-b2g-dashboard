name: Extract Art Notice Documents

on:
  workflow_dispatch:
    inputs:
      research_id:
        description: "테스트할 공고 Research ID"
        required: true
        default: "external-10a9592b4d5eec3a"

permissions:
  contents: write

concurrency:
  group: extract-art-notices
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      ART_NOTICE_ID: ${{ inputs.research_id }}

      AXOO_BRIDGE_URL: ${{ secrets.AXOO_BRIDGE_URL }}

      AXOO_BRIDGE_TOKEN: ${{ secrets.AXOO_BRIDGE_TOKEN }}

    steps:

      # ======================================================
      # SETUP
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "24"


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf


      # ======================================================
      # STEP 1
      # Google Drive
      # → Apps Script Bridge
      # → HWP / HWPX / PDF
      # ======================================================

      - name: Download notice files from Drive Bridge
        run: |
          node scripts/extract_art_notice_attachments.js


      # ======================================================
      # STEP 2
      # HWP / HWPX / PDF
      # → Raw Text JSON
      # ======================================================

      - name: Extract document text
        run: |
          python scripts/extract_art_notice_text.py


      # ======================================================
      # GitHub Runner 임시 file:// URL 제거
      # ======================================================

      - name: Sanitize extracted JSON
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Result not found: {path}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          data["source"] = (
              "apps_script_bridge"
          )

          data["sourceUrl"] = ""

          for doc in data.get(
              "documents",
              []
          ):
              doc.pop(
                  "url",
                  None
              )

              doc["source"] = (
                  "apps_script_bridge"
              )

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY


      # ======================================================
      # TEXT 추출 검증
      # ======================================================

      - name: Validate extraction result
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          attachment_path = Path(
              "data/art_notice_attachments.json"
          )

          text_path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          attachments = json.loads(
              attachment_path.read_text(
                  encoding="utf-8"
              )
          )

          target = next(
              (
                  item
                  for item in attachments
                  if item.get(
                      "researchId"
                  ) == research_id
              ),
              None
          )

          if not target:
              raise SystemExit(
                  "Bridge attachment result missing"
              )

          if target.get(
              "status"
          ) != "ok":
              raise SystemExit(
                  "Bridge download failed"
              )

          attachment_count = len(
              target.get(
                  "attachments",
                  []
              )
          )

          if attachment_count < 1:
              raise SystemExit(
                  "No notice files received"
              )

          if not text_path.exists():
              raise SystemExit(
                  f"Result file not found: "
                  f"{text_path}"
              )

          data = json.loads(
              text_path.read_text(
                  encoding="utf-8"
              )
          )

          document_count = int(
              data.get(
                  "documentCount"
              ) or 0
          )

          success_count = int(
              data.get(
                  "successCount"
              ) or 0
          )

          print("")
          print(
              "========================================"
          )
          print(
              "AXOO TEXT EXTRACTION RESULT"
          )
          print(
              "========================================"
          )

          print(
              "Research ID:",
              research_id
          )

          print(
              "Bridge files:",
              attachment_count
          )

          print(
              "Documents:",
              document_count
          )

          print(
              "Success:",
              success_count
          )

          for doc in data.get(
              "documents",
              []
          ):
              print(
                  "-",
                  doc.get("name"),
                  "|",
                  doc.get("status"),
                  "|",
                  doc.get("textLength"),
                  "chars"
              )

          if document_count < 1:
              raise SystemExit(
                  "No documents processed"
              )

          if (
              success_count !=
              document_count
          ):
              raise SystemExit(
                  f"Text extraction incomplete: "
                  f"{success_count}/"
                  f"{document_count}"
              )

          print(
              "========================================"
          )
          PY


      # ======================================================
      # STEP 3
      # Raw Text
      # → Structured Analysis
      # ======================================================

      - name: Build structured notice analysis
        run: |
          python scripts/build_art_notice_analysis.py


      # ======================================================
      # 구조화 결과 검증 + 로그 출력
      # ======================================================

      - name: Validate structured analysis
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          path = (
              Path("data")
              / "art_notice_analysis"
              / f"{research_id}.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Analysis file not found: "
                  f"{path}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "Analysis status is not OK"
              )

          fields = data.get(
              "fields",
              {}
          )

          summary = data.get(
              "analysisSummary",
              {}
          )

          field_count = int(
              summary.get(
                  "fieldCount"
              ) or 0
          )

          found_count = int(
              summary.get(
                  "foundCount"
              ) or 0
          )

          print("")
          print(
              "========================================"
          )
          print(
              "AXOO STRUCTURED NOTICE ANALYSIS"
          )
          print(
              "========================================"
          )

          print(
              "Research ID:",
              data.get("researchId")
          )

          print(
              "Title:",
              data.get("title")
          )

          print(
              "Fields:",
              found_count,
              "/",
              field_count
          )

          print("")

          labels = {
              "eligibility":
                  "참가자격",

              "artBudget":
                  "작품비",

              "artworkCount":
                  "작품수",

              "installationDate":
                  "설치예정일",

              "installationConditions":
                  "설치조건",

              "artworkScale":
                  "작품규모/하중",

              "applicationPeriod":
                  "접수기간",

              "judgingAnnouncement":
                  "심사발표",

              "submissionDocuments":
                  "제출서류",

              "submissionMethod":
                  "접수방식",

              "judgingCriteria":
                  "심사기준",

              "cautions":
                  "유의사항"
          }

          for key, label in labels.items():

              field = fields.get(
                  key,
                  {}
              )

              value = str(
                  field.get(
                      "value",
                      ""
                  )
              )

              if len(value) > 160:
                  value = (
                      value[:160]
                      + "..."
                  )

              print(
                  f"[{label}]"
              )

              print(
                  value
                  if value
                  else "(미검출)"
              )

              print("")

          if field_count < 1:
              raise SystemExit(
                  "No analysis fields"
              )

          if found_count < 1:
              raise SystemExit(
                  "No structured values detected"
              )

          print(
              "========================================"
          )
          PY


      # ======================================================
      # Runtime 파일 삭제
      #
      # 원본 HWP 바이너리는 GitHub에 Commit하지 않는다.
      # ======================================================

      - name: Cleanup runtime files
        if: always()
        shell: bash

        run: |
          rm -rf .tmp

          git restore \
            data/art_notice_attachments.json \
            2>/dev/null || true


      # ======================================================
      # Text + Analysis 변경 확인
      # ======================================================

      - name: Check generated data
        id: changes
        shell: bash

        run: |
          if [ -n "$(git status --porcelain -- \
            data/art_notice_text \
            data/art_notice_analysis)" ]; then

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # 결과 Commit
      # ======================================================

      - name: Commit extracted notice data
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_notice_text \
            data/art_notice_analysis

          git commit \
            -m "Extract and analyze art notice"

          git push
