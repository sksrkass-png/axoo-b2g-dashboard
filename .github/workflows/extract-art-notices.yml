name: Extract Art Notice Documents

on:
  workflow_dispatch:
    inputs:
      research_id:
        description: "테스트할 공고 Research ID"
        required: true
        default: "external-10a9592b4d5eec3a"

permissions:
  contents: write

concurrency:
  group: extract-art-notices
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    env:
      ART_NOTICE_ID: ${{ inputs.research_id }}

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # --------------------------------------------------
      # 4. Python dependencies
      # --------------------------------------------------

      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf


      # --------------------------------------------------
      # 5. 공고 페이지 → 첨부파일 URL 수집
      # --------------------------------------------------

      - name: Collect notice attachments
        run: |
          node scripts/extract_art_notice_attachments.js


      # --------------------------------------------------
      # 6. HWP / HWPX / PDF → TEXT
      # --------------------------------------------------

      - name: Extract document text
        run: |
          python scripts/extract_art_notice_text.py


      # --------------------------------------------------
      # 7. 결과 확인
      #
      # 전체 본문을 로그에 출력하지 않고
      # 파일명 / 상태 / 글자수만 확인
      # --------------------------------------------------

      - name: Show extraction summary
        shell: bash

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Result file not found: {path}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print("")
          print("========================================")
          print("AXOO ART NOTICE EXTRACTION RESULT")
          print("========================================")
          print("Research ID:", data.get("researchId"))
          print("Title:", data.get("title"))
          print("Status:", data.get("status"))
          print("Documents:", data.get("documentCount"))
          print("Success:", data.get("successCount"))
          print("")

          for doc in data.get("documents", []):
              print(
                  "-",
                  doc.get("name"),
                  "|",
                  doc.get("status"),
                  "|",
                  doc.get("textLength"),
                  "chars"
              )

          print("========================================")
          PY


      # --------------------------------------------------
      # 8. 변경 여부 확인
      # --------------------------------------------------

      - name: Check generated files
        id: changes
        shell: bash

        run: |
          if [ -n "$(git status --porcelain -- \
            data/art_notice_attachments.json \
            data/art_notice_text)" ]; then

            echo "changed=true" >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 9. 추출 결과 Commit
      # --------------------------------------------------

      - name: Commit extracted notice data
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_notice_attachments.json \
            data/art_notice_text

          git commit \
            -m "Extract art notice documents"

          git push
