name: Verify Annual Support Ledger

on:
  workflow_dispatch:
  push:
    paths:
      - "data/support_ledger_reference.json"
      - "support_ledger.js"
      - "support_ledger.css"
      - "support_pipeline.js"
      - "support_pipeline.css"
      - "scripts/test_support_pipeline.js"
      - "scripts/sync_airtable_support_candidates.js"
      - "scripts/test_airtable_candidate_sync.js"
      - "scripts/create_support_alerts.js"
      - "scripts/test_support_alerts.js"
      - "scripts/test_b2g_director_dashboard.js"
      - "dashboard_priority_update.js"
      - "index.html"
      - "scripts/test_support_ledger.js"
      - ".github/workflows/verify-support-ledger.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check UI JavaScript syntax
        run: |
          node --check support_ledger.js
          node --check support_pipeline.js
          node --check dashboard_priority_update.js
      - name: Verify annual grant ledger
        run: node scripts/test_support_ledger.js
      - name: Verify P2 application management
        run: node scripts/test_support_pipeline.js
      - name: Verify Airtable candidate mirror field safety
        run: node scripts/test_airtable_candidate_sync.js
      - name: Verify P5 grant notifications
        run: node scripts/test_support_alerts.js
      - name: Verify P6 protected director KPI navigation
        run: node scripts/test_b2g_director_dashboard.js
