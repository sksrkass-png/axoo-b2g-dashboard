name: Collect Support Programs

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron = UTC
    # 00:40 UTC = 한국시간 오전 09:40
    - cron: "40 0 * * *"

permissions:
  contents: write

concurrency:
  group: axoo-dashboard-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # 1. Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # 2. Node.js
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # ------------------------------------------
      # 3. 문화예술 지원사업 수집
      # 현재 KAMS부터 운영
      # ------------------------------------------

      - name: Collect support programs
        run: node scripts/collect_support_programs.js


      # ------------------------------------------
      # 4. Priority 데이터 통합 생성
      # support_programs + G2B
      # ------------------------------------------

      - name: Build priority projects
        run: node scripts/build_priority_projects.js


      # ------------------------------------------
      # 5. 결과 확인
      # ------------------------------------------

      - name: Show collection result
        shell: bash

        run: |
          echo "===================================="
          echo "SUPPORT PROGRAM COLLECTION RESULT"
          echo "===================================="

          node -e "
          const fs = require('fs');

          const support = JSON.parse(
            fs.readFileSync(
              'data/support_programs.json',
              'utf8'
            )
          );

          const priority = JSON.parse(
            fs.readFileSync(
              'data/priority_projects.json',
              'utf8'
            )
          );

          const kams = support.filter(
            item => item.sourceCode === 'KAMS'
          );

          const supportPriority = priority.filter(
            item =>
              item.priorityCategory ===
              'arts_content_support'
          );

          console.log(
            '지원사업 원본:',
            support.length + '건'
          );

          console.log(
            'KAMS:',
            kams.length + '건'
          );

          console.log(
            '대시보드 지원사업:',
            supportPriority.length + '건'
          );

          console.log('');

          supportPriority
            .slice(0, 10)
            .forEach(
              (item, index) => {
                console.log(
                  (index + 1) + '.',
                  item.grade,
                  item.title,
                  '/',
                  item.deadline ||
                    '마감일 미확인',
                  '/',
                  item.source ||
                    item.organization ||
                    ''
                );
              }
            );
          "


      # ------------------------------------------
      # 6. 샘플 데이터 잔존 여부 QA
      # ------------------------------------------

      - name: Validate support dashboard data
        shell: bash

        run: |
          node -e "
          const fs = require('fs');

          const priority = JSON.parse(
            fs.readFileSync(
              'data/priority_projects.json',
              'utf8'
            )
          );

          const support = priority.filter(
            item =>
              item.priorityCategory ===
              'arts_content_support'
          );

          const samples = support.filter(
            item =>
              String(item.title || '')
                .includes('샘플')
          );

          if (samples.length > 0) {
            console.error(
              '❌ 기존 샘플 지원사업이 남아 있습니다.'
            );

            samples.forEach(
              item =>
                console.error(
                  '-',
                  item.title
                )
            );

            process.exit(1);
          }

          if (support.length === 0) {
            console.error(
              '❌ 대시보드용 지원사업 데이터가 0건입니다.'
            );

            process.exit(1);
          }

          console.log(
            '✅ 샘플 데이터 없음'
          );

          console.log(
            '✅ 실제 지원사업:',
            support.length + '건'
          );
          "


      # ------------------------------------------
      # 7. 변경 여부 확인
      # ------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/support_programs.json \
            data/priority_projects.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------
      # 8. 데이터 저장
      # ------------------------------------------

      - name: Commit support dashboard data
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/support_programs.json \
            data/priority_projects.json

          git commit \
            -m "Update support program dashboard data"

          git push
