name: Collect Support Programs

on:
  workflow_dispatch:

  push:
    paths:
      - "scripts/support_program_intelligence.js"
      - "scripts/regrade_support_programs.js"
      - "scripts/score_support_reference.js"
      - "scripts/test_support_reference_scores.js"
      - "data/support_ledger_reference.json"
      - "scripts/test_fit_scoring_v2.js"
      - "scripts/test_support_program_intelligence.js"
      - "scripts/collect_support_programs.js"
      - "scripts/collect_regional_support.js"
      - "scripts/test_regional_support.js"
      - "scripts/sync_airtable_support_candidates.js"
      - "scripts/test_airtable_candidate_sync.js"
      - "scripts/create_support_alerts.js"
      - "scripts/test_support_alerts.js"
      - "scripts/support_application_review.js"
      - "scripts/enrich_support_documents.js"
      - "scripts/extract_support_attachment.py"
      - "scripts/test_support_document_review.js"
      - "scripts/test_support_attachment_parser.py"
      - "scripts/build_priority_projects.js"
      - ".github/workflows/collect-support-programs.yml"

  schedule:
    # GitHub Actions cron = UTC
    # Two-hour official source checks (UTC 00,02,...22:40); no instant website push.
    - cron: "40 */2 * * *"

permissions:
  contents: write

concurrency:
  group: axoo-dashboard-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      # ------------------------------------------
      # 1. Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # 2. Node.js
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # ------------------------------------------
      # 3. 상세 공고 분석·점수 계산 자체 테스트
      # ------------------------------------------

      - name: Test support program intelligence
        run: |
          node scripts/test_support_program_intelligence.js
          node scripts/test_fit_scoring_v2.js


      # ------------------------------------------
      # 4. 문화예술 지원사업 수집
      # KAMS + ARKO + KCDF + KOCCA
      # ------------------------------------------

      - name: Collect support programs
        run: node scripts/collect_support_programs.js

      - name: Test regional grant parsing and validation
        run: node scripts/test_regional_support.js

      - name: Collect additional official regional grants
        run: node scripts/collect_regional_support.js

      - name: Setup Python for attachment extraction
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PDF text parser
        run: python -m pip install --disable-pip-version-check --quiet "pypdf==6.1.3"

      - name: Verify applicant and attachment rules
        run: |
          node scripts/test_support_document_review.js
          python scripts/test_support_attachment_parser.py

      - name: Enrich grants with applicant and document evidence
        run: node scripts/enrich_support_documents.js

      - name: Regrade all cached notices with current AXOO FIT v2
        run: node scripts/regrade_support_programs.js

      - name: Score reference grants as provisional, never verified
        run: |
          node scripts/test_support_reference_scores.js
          node scripts/score_support_reference.js


      # ------------------------------------------
      # 5. Priority 데이터 통합 생성
      # support_programs + G2B
      # ------------------------------------------

      - name: Build priority projects
        run: node scripts/build_priority_projects.js


      # ------------------------------------------
      # 6. 결과 확인
      # ------------------------------------------

      - name: Show collection result
        shell: bash

        run: |
          echo "===================================="
          echo "SUPPORT PROGRAM COLLECTION RESULT"
          echo "===================================="

          node -e "
          const fs = require('fs');

          const support = JSON.parse(
            fs.readFileSync(
              'data/support_programs.json',
              'utf8'
            )
          );

          const priority = JSON.parse(
            fs.readFileSync(
              'data/priority_projects.json',
              'utf8'
            )
          );

          const kams = support.filter(
            item => item.sourceCode === 'KAMS'
          );

          const supportPriority = priority.filter(
            item =>
              item.priorityCategory ===
              'arts_content_support'
          );

          console.log(
            '지원사업 원본:',
            support.length + '건'
          );

          console.log(
            'KAMS:',
            kams.length + '건'
          );

          console.log(
            '대시보드 지원사업:',
            supportPriority.length + '건'
          );

          console.log('');

          supportPriority
            .slice(0, 10)
            .forEach(
              (item, index) => {
                console.log(
                  (index + 1) + '.',
                  item.grade,
                  item.title,
                  '/',
                  item.deadline ||
                    '마감일 미확인',
                  '/',
                  item.source ||
                    item.organization ||
                    ''
                );
              }
            );
          "


      # ------------------------------------------
      # 7. 샘플 데이터 잔존 여부 QA
      # ------------------------------------------

      - name: Validate support dashboard data
        shell: bash

        run: |
          node -e "
          const fs = require('fs');

          const priority = JSON.parse(
            fs.readFileSync(
              'data/priority_projects.json',
              'utf8'
            )
          );

          const support = priority.filter(
            item =>
              item.priorityCategory ===
              'arts_content_support'
          );

          const samples = support.filter(
            item =>
              String(item.title || '')
                .includes('샘플')
          );

          if (samples.length > 0) {
            console.error(
              '❌ 기존 샘플 지원사업이 남아 있습니다.'
            );

            samples.forEach(
              item =>
                console.error(
                  '-',
                  item.title
                )
            );

            process.exit(1);
          }

          if (support.length === 0) {
            console.error(
              '❌ 대시보드용 지원사업 데이터가 0건입니다.'
            );

            process.exit(1);
          }

          const invalidAnalysis = support.filter(
            item =>
              !item.businessArea ||
              !item.businessAreaLabel ||
              !Array.isArray(item.scoreBreakdown)
          );

          if (invalidAnalysis.length > 0) {
            console.error(
              '❌ 사업영역 또는 상세 점수 데이터가 누락되었습니다.'
            );

            process.exit(1);
          }

          console.log(
            '✅ 샘플 데이터 없음'
          );

          console.log(
            '✅ 실제 지원사업:',
            support.length + '건'
          );
          "


      # ------------------------------------------
      # 8. 변경 여부 확인
      # ------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/support_programs.json \
            data/support_regional_programs.json \
            data/support_collection_health.json \
            data/support_enrichment_cache.json \
            data/priority_projects.json \
            data/support_ledger_reference_scores.json && \
            test -z "$(git ls-files --others --exclude-standard -- data/support_ledger_reference_scores.json)"; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------
      # 9. 데이터 저장
      # ------------------------------------------

      - name: Commit support dashboard data
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve only this collector's outputs outside the Git working tree.
          # Another workflow may update priority_projects.json while we collect.
          SNAPSHOT_DIR="$(mktemp -d)"
          cp data/support_programs.json "$SNAPSHOT_DIR/support_programs.json"
          cp data/support_regional_programs.json "$SNAPSHOT_DIR/support_regional_programs.json"
          cp data/support_collection_health.json "$SNAPSHOT_DIR/support_collection_health.json"
          cp data/support_enrichment_cache.json "$SNAPSHOT_DIR/support_enrichment_cache.json"

          for attempt in 1 2 3 4; do
            echo "Data publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            cp "$SNAPSHOT_DIR/support_programs.json" data/support_programs.json
            cp "$SNAPSHOT_DIR/support_regional_programs.json" data/support_regional_programs.json
            cp "$SNAPSHOT_DIR/support_collection_health.json" data/support_collection_health.json
            cp "$SNAPSHOT_DIR/support_enrichment_cache.json" data/support_enrichment_cache.json

            # Rebuild on the freshest upstream G2B and user-provided reference source.
            node scripts/build_priority_projects.js
            node scripts/score_support_reference.js

            git add \
              data/support_programs.json \
              data/support_regional_programs.json \
              data/support_collection_health.json \
              data/support_enrichment_cache.json \
              data/priority_projects.json \
              data/support_ledger_reference_scores.json

            if git diff --cached --quiet; then
              echo "No new data differences after sync"
              exit 0
            fi

            git diff --cached --check
            git commit -m "Refresh official support sources and AXOO opportunity ledger"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 4
          done
          echo "Failed to publish collector outputs after four attempts"
          exit 1

      # ------------------------------------------
      # 10. Secure candidate-only Airtable mirror
      # ------------------------------------------
      - name: Verify Airtable candidate field mapping
        run: node scripts/test_airtable_candidate_sync.js

      - name: Sync official support candidates to Airtable
        # Missing AIRTABLE_PAT is a documented setup state; actual sync failures must fail the run.
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: node scripts/sync_airtable_support_candidates.js

      # ------------------------------------------
      # 11. P5 new grant and D-7/D-3 notification inbox
      # ------------------------------------------
      - name: Test support notification windows and deduplication
        run: node scripts/test_support_alerts.js

      - name: Create Airtable grant alerts without replaying history
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: node scripts/create_support_alerts.js
