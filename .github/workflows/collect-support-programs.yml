name: Collect Support Programs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-support-programs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # 1. Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # 2. Node.js
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # ------------------------------------------
      # 3. 문화예술 지원사업 수집
      # 현재는 KAMS 테스트
      # ------------------------------------------

      - name: Collect support programs
        run: node scripts/collect_support_programs.js


      # ------------------------------------------
      # 4. 결과 확인
      # ------------------------------------------

      - name: Show collection result
        shell: bash

        run: |
          echo "===================================="
          echo "SUPPORT PROGRAM COLLECTION RESULT"
          echo "===================================="

          node -e "
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync(
              'data/support_programs.json',
              'utf8'
            )
          );

          console.log('총 수집:', data.length + '건');

          const kams = data.filter(
            item => item.sourceCode === 'KAMS'
          );

          console.log('KAMS:', kams.length + '건');

          console.log('');

          kams.slice(0, 10).forEach(
            (item, index) => {
              console.log(
                (index + 1) + '.',
                item.grade,
                item.title,
                '/',
                item.deadline || '마감일 미확인'
              );
            }
          );
          "


      # ------------------------------------------
      # 5. 변경 여부 확인
      # ------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/support_programs.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------
      # 6. 실제 데이터가 변경되었으면 저장
      # ------------------------------------------

      - name: Commit support programs
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/support_programs.json

          git commit \
            -m "Collect KAMS support programs"

          git push
