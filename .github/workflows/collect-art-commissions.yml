name: Collect Art Commissions

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron은 UTC 기준.
    # 00:00 UTC = 한국시간 오전 09:00
    - cron: "0 0 * * *"


permissions:
  contents: write


concurrency:
  group: collect-art-commissions
  cancel-in-progress: false


jobs:

  collect:

    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"

  # --------------------------------------------------
      # 3. Collector JavaScript 문법 사전 검증
      #
      # 실제 크롤링 전에 SyntaxError를 즉시 차단.
      # --------------------------------------------------

      - name: Validate collector JavaScript syntax
        run: |
          node --check scripts/art_region_scope.js
          node --check scripts/art_commission_sources.js
          node --check scripts/run_art_collectors.js
          node --check scripts/collect_art_commissions.js
          node --check scripts/collect_seoul_art_commissions.js
          node --check scripts/collect_incheon_art_commissions.js
          node --check scripts/collect_busan_art_commissions.js
          node --check scripts/collect_remaining_art_commissions.js
          node --check scripts/normalize_art_dates.js

      # --------------------------------------------------
      # 3. 전국 17개 시도 Source Registry 검증
      #
      # 누락 지역이 있으면 여기서 중단.
      # 아직 실제 수집을 시작하기 전 단계.
      # --------------------------------------------------

      - name: Validate nationwide art source registry
        run: node scripts/art_commission_sources.js


      # --------------------------------------------------
      # 4. 지역별 건축물 미술작품 수집
      #
      # 현재 활성화된 Collector를 실행.
      # 각 지역 실패는 run_art_collectors.js에서 격리.
      # --------------------------------------------------
      
      - name: Diagnose Korean public site network
        run: |
          echo "=== GYEONGGI IPv4 ==="
          curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.gg.go.kr/publicart/main.do || true

          echo "=== INCHEON IPv4 ==="
          curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.incheon.go.kr/culture/CU070302 || true

          echo "=== BUSAN IPv4 ==="
          curl -4 -I -L --connect-timeout 10 --max-time 20 https://www.busan.go.kr/nbgosi || true

          echo "=== GYEONGGI NORMAL ==="
          curl -I -L --connect-timeout 10 --max-time 20 https://www.gg.go.kr/publicart/main.do || true
          
      - name: Collect regional art commissions
        run: node scripts/run_art_collectors.js


      # --------------------------------------------------
      # 5. 원문 날짜 검증
      # --------------------------------------------------

      - name: Normalize collected dates
        run: node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 6. 마감 공고 LIVE 제거
      # --------------------------------------------------

      - name: Remove expired items from live feed
        run: node scripts/collect_art_commissions.js --prune-expired


      # --------------------------------------------------
      # 7. Archive current flag 재계산
      # --------------------------------------------------

      - name: Refresh archive current flags
        run: node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 8. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/art_commissions.json \
            data/art_commissions_archive.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 9. 변경된 경우만 Commit
      # --------------------------------------------------

      - name: Commit collected art commissions
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_commissions.json \
            data/art_commissions_archive.json

          git commit \
            -m "Collect current art commissions"

          git push
