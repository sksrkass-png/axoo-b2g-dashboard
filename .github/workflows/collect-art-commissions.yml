name: Collect Art Commissions

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron은 UTC 기준.
    # 00:00 UTC = 한국시간 오전 09:00
    - cron: "0 0 * * *"

  # 다른 자동화가 LIVE 공고 파일을 덮어쓰면
  # 즉시 공식 Collector로 다시 검증/복구
  push:
    branches:
      - main
    paths:
      - "data/art_commissions.json"

permissions:
  contents: write


concurrency:
  group: collect-art-commissions
  cancel-in-progress: false


jobs:

  collect:

    # Collector 자신의 commit으로 무한 재실행되는 것 방지
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          ref: main
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. Collector JavaScript 문법 사전 검증
      # --------------------------------------------------

      - name: Validate collector JavaScript syntax
        run: |
          node --check scripts/art_region_scope.js
          node --check scripts/art_commission_sources.js
          node --check scripts/run_art_collectors.js
          node --check scripts/collect_art_commissions.js
          node --check scripts/collect_seoul_art_commissions.js
          node --check scripts/collect_incheon_art_commissions.js
          node --check scripts/collect_busan_art_commissions.js
          node --check scripts/collect_remaining_art_commissions.js
          node --check scripts/filter_art_commission_results.js
          node --check scripts/normalize_art_dates.js
          node --check scripts/repair_art_deadlines.js


      # --------------------------------------------------
      # 4. 결과/후속 고지 필터 자체 테스트
      # --------------------------------------------------

      - name: Test art commission result filter
        run: |
          node scripts/filter_art_commission_results.js --self-test


      # --------------------------------------------------
      # 5. 마감일 보완기 자체 테스트
      #
      # 대표 검증:
      # 작품접수 - 일자 : 2026. 10. 02.(금) 14:00 까지
      # → 2026-10-02
      # --------------------------------------------------

      - name: Test art commission deadline repair
        run: |
          node scripts/repair_art_deadlines.js --self-test


      # --------------------------------------------------
      # 6. 전국 17개 시도 Source Registry 검증
      # --------------------------------------------------

      - name: Validate nationwide art source registry
        run: |
          node scripts/art_commission_sources.js


      # --------------------------------------------------
      # 7. 주요 공공사이트 네트워크 진단
      # --------------------------------------------------

      - name: Diagnose Korean public site network
        run: |

          echo "=== GYEONGGI PUBLIC ART BOARD ==="

          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.gg.go.kr/publicart/bbs/board.do?bsIdx=825&menuId=3865" \
            || true


          echo "=== INCHEON IPv4 ==="

          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.incheon.go.kr/culture/CU070302" \
            || true


          echo "=== BUSAN IPv4 ==="

          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.busan.go.kr/nbgosi" \
            || true


      # --------------------------------------------------
      # 8. 지역별 건축물 미술작품 수집
      # --------------------------------------------------

      - name: Collect regional art commissions
        run: |
          node scripts/run_art_collectors.js


      # --------------------------------------------------
      # 9. 결과 / 당선작 / 심사결과 등 제거
      #
      # 실제 신규 지원이 가능한 공고만 남긴다.
      #
      # 제거:
      # - 당선작
      # - 선정결과
      # - 공모결과
      # - 심사결과
      # - 심의결과
      # - 결과공고
      #
      # 보존:
      # - 재공모
      # - 재공고
      # - 추가공모
      # - 추가모집
      # --------------------------------------------------

      - name: Remove result and follow-up art notices
        run: |
          node scripts/filter_art_commission_results.js


      # --------------------------------------------------
      # 10. 원문 날짜 정규화
      #
      # 1차 날짜 추출
      # - 접수기간
      # - 제출기간
      # - 마감일
      # - 기존 deadline
      # --------------------------------------------------

      - name: Normalize collected dates
        run: |
          node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 11. 누락 마감일 2차 보완
      #
      # 날짜 정규화 후에도 deadline이 없는 공고만 검사.
      #
      # 예:
      # ■ 작품접수
      # - 일자 : 2026. 10. 02.(금) 14:00 까지
      #
      # → deadline = 2026-10-02
      #
      # 기존 정상 deadline은 절대 덮어쓰지 않는다.
      # --------------------------------------------------

      - name: Repair missing art commission deadlines
        run: |
          node scripts/repair_art_deadlines.js


      # --------------------------------------------------
      # 12. 마감 공고 LIVE 제거
      #
      # 2차 보완된 deadline까지 반영한 뒤
      # 실제 마감된 공고를 LIVE에서 제거한다.
      # --------------------------------------------------

      - name: Remove expired items from live feed
        run: |
          node scripts/collect_art_commissions.js --prune-expired


      # --------------------------------------------------
      # 13. Archive current flag 및 날짜 상태 재계산
      #
      # repair에서 채운 기존 deadline도
      # normalize_art_dates.js가 existing_deadline으로 보존한다.
      # --------------------------------------------------

      - name: Refresh archive current flags
        run: |
          node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 14. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |

          if git diff --quiet -- \
            data/art_commissions.json \
            data/art_commissions_archive.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 15. 변경된 경우만 Commit + Rebase + Push
      # --------------------------------------------------

      - name: Commit collected art commissions
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/art_commissions.json \
            data/art_commissions_archive.json


          git commit \
            -m "Collect current art commissions"


          echo "=== Sync latest main before push ==="


          git fetch origin main

          git rebase origin/main


          echo "=== Push collected data ==="


          git push origin HEAD:main
