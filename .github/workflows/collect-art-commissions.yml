name: Collect Art Commissions

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron은 UTC 기준.
    # 00:00 UTC = 한국시간 오전 09:00
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: collect-art-commissions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          ref: main
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. Collector JavaScript 문법 사전 검증
      # --------------------------------------------------

      - name: Validate collector JavaScript syntax
        run: |
          node --check scripts/art_region_scope.js
          node --check scripts/art_commission_sources.js
          node --check scripts/run_art_collectors.js
          node --check scripts/collect_art_commissions.js
          node --check scripts/collect_seoul_art_commissions.js
          node --check scripts/collect_incheon_art_commissions.js
          node --check scripts/collect_busan_art_commissions.js
          node --check scripts/collect_remaining_art_commissions.js
          node --check scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 4. 전국 17개 시도 Source Registry 검증
      # --------------------------------------------------

      - name: Validate nationwide art source registry
        run: node scripts/art_commission_sources.js


      # --------------------------------------------------
      # 5. 주요 공공사이트 네트워크 진단
      # --------------------------------------------------

      - name: Diagnose Korean public site network
        run: |
          echo "=== GYEONGGI PUBLIC ART BOARD ==="
          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.gg.go.kr/publicart/bbs/board.do?bsIdx=825&menuId=3865" \
            || true

          echo "=== INCHEON IPv4 ==="
          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.incheon.go.kr/culture/CU070302" \
            || true

          echo "=== BUSAN IPv4 ==="
          curl -4 -I -L \
            --connect-timeout 10 \
            --max-time 20 \
            "https://www.busan.go.kr/nbgosi" \
            || true


      # --------------------------------------------------
      # 6. 지역별 건축물 미술작품 수집
      # --------------------------------------------------

      - name: Collect regional art commissions
        run: node scripts/run_art_collectors.js


      # --------------------------------------------------
      # 7. 원문 날짜 정규화
      #
      # v1.4.0:
      # - 2자리 연도 지원
      # - 실제 접수/제출일 우선
      # - 비정상 장기 공모기간 방어
      # - 오래된 마감일 미확인 공고 stale 판정
      # --------------------------------------------------

      - name: Normalize collected dates
        run: node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 8. 마감 공고 LIVE 제거
      # --------------------------------------------------

      - name: Remove expired items from live feed
        run: node scripts/collect_art_commissions.js --prune-expired


      # --------------------------------------------------
      # 9. Archive current flag 재계산
      # --------------------------------------------------

      - name: Refresh archive current flags
        run: node scripts/normalize_art_dates.js


      # --------------------------------------------------
      # 10. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/art_commissions.json \
            data/art_commissions_archive.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 11. 변경된 경우만 Commit + Rebase + Push
      #
      # 실행 중 원격 main에 다른 커밋이 추가되더라도
      # fetch first 오류가 나지 않도록 push 직전
      # 최신 main을 rebase 한다.
      # --------------------------------------------------

      - name: Commit collected art commissions
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/art_commissions.json \
            data/art_commissions_archive.json

          git commit \
            -m "Collect current art commissions"

          echo "=== Sync latest main before push ==="

          git fetch origin main

          git rebase origin/main

          echo "=== Push collected data ==="

          git push origin HEAD:main
