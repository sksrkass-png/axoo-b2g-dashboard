name: Collect G2B Opportunities

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron = UTC
    # 00:20 UTC = 한국시간 오전 09:20
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: axoo-dashboard-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. G2B 수집
      #
      # Collector 내부 최대 3회 재시도
      # Workflow 전체 최대 2회
      # --------------------------------------------------

      - name: Collect G2B opportunities
        shell: bash

        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}

        run: |
          for attempt in 1 2; do

            echo "===================================="
            echo "G2B WORKFLOW ATTEMPT ${attempt}/2"
            echo "===================================="

            if node scripts/collect_g2b_opportunities.js; then

              echo "✅ G2B collection succeeded"
              exit 0

            fi


            if [ "$attempt" -lt 2 ]; then

              echo ""
              echo "⚠️ G2B collection failed."
              echo "30초 후 전체 수집을 다시 시도합니다."

              sleep 30

            fi

          done


          echo ""
          echo "❌ G2B collection failed after 2 workflow attempts."

          exit 1


      # --------------------------------------------------
      # 4. 메인 대시보드 Priority 데이터 생성
      #
      # b2g_opportunities.json
      #       ↓
      # priority_projects.json
      #
      # 기존 지원사업 데이터는 유지하고
      # 나라장터 부분만 최신 데이터로 교체.
      # --------------------------------------------------

      - name: Build dashboard priority projects
        run: node scripts/build_priority_projects.js


      # --------------------------------------------------
      # 5. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/b2g_opportunities.json \
            data/priority_projects.json \
            data/dashboard_meta.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 6. 변경된 경우만 Commit
      # --------------------------------------------------

      - name: Commit G2B opportunities
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/b2g_opportunities.json \
            data/priority_projects.json \
            data/dashboard_meta.json


          git commit \
            -m "Collect G2B opportunities"


          git push
