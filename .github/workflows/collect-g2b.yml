name: Collect G2B Opportunities

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-g2b-opportunities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. G2B API
      #
      # Secret 값은 로그에 출력하지 않는다.
      # --------------------------------------------------

      - name: Collect G2B opportunities
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}

        run: node scripts/collect_g2b_opportunities.js


      # --------------------------------------------------
      # 4. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/b2g_opportunities.json \
            data/dashboard_meta.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 5. 변경된 경우만 Commit
      # --------------------------------------------------

      - name: Commit G2B opportunities
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/b2g_opportunities.json \
            data/dashboard_meta.json

          git commit \
            -m "Collect G2B opportunities"

          git push
