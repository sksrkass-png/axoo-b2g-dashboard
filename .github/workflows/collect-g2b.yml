name: Collect G2B Opportunities

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron = UTC
    # 00:20 UTC = 한국시간 오전 09:20
    - cron: "20 0 * * *"

permissions:
  contents: write

concurrency:
  group: collect-g2b-opportunities
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"


      # --------------------------------------------------
      # 3. G2B 수집
      #
      # collect_g2b_opportunities.js 내부에서도
      # API 호출을 최대 3회 재시도함.
      #
      # 여기서는 스크립트 전체를 한 번 더 재실행.
      #
      # 즉 일시적인 data.go.kr 장애 시:
      #
      # 1차 실행
      #   └ API 최대 3회
      #
      # 30초 대기
      #
      # 2차 실행
      #   └ API 최대 3회
      #
      # 최대 6번의 연결 기회 확보.
      # --------------------------------------------------

      - name: Collect G2B opportunities
        shell: bash

        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}

        run: |
          for attempt in 1 2; do

            echo "===================================="
            echo "G2B WORKFLOW ATTEMPT ${attempt}/2"
            echo "===================================="

            if node scripts/collect_g2b_opportunities.js; then

              echo "✅ G2B collection succeeded"
              exit 0

            fi


            if [ "$attempt" -lt 2 ]; then

              echo ""
              echo "⚠️ G2B collection failed."
              echo "30초 후 전체 수집을 다시 시도합니다."

              sleep 30

            fi

          done


          echo ""
          echo "❌ G2B collection failed after 2 workflow attempts."

          exit 1


      # --------------------------------------------------
      # 4. 변경 여부 확인
      # --------------------------------------------------

      - name: Check changes
        id: changes
        shell: bash

        run: |
          if git diff --quiet -- \
            data/b2g_opportunities.json \
            data/dashboard_meta.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # --------------------------------------------------
      # 5. 변경된 경우만 Commit
      # --------------------------------------------------

      - name: Commit G2B opportunities
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/b2g_opportunities.json \
            data/dashboard_meta.json


          git commit \
            -m "Collect G2B opportunities"


          git push
