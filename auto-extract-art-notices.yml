name: Auto Extract Art Notice Documents

on:
  workflow_dispatch:

  schedule:
    # 매시간 45분마다 자동 확인
    - cron: "45 * * * *"


permissions:
  contents: write


concurrency:
  group: auto-extract-art-notices
  cancel-in-progress: false


jobs:

  auto-extract:

    runs-on: ubuntu-latest


    env:

      AXOO_BRIDGE_URL: ${{ secrets.AXOO_BRIDGE_URL }}

      AXOO_BRIDGE_TOKEN: ${{ secrets.AXOO_BRIDGE_TOKEN }}


    steps:


      # ======================================================
      # SETUP
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "24"


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      - name: Install document parsers
        run: |
          python -m pip install --upgrade pip
          pip install olefile pypdf


      # ======================================================
      # STEP 1
      # Project Control
      # → File Bridge
      # → 자동 분석 Queue 생성
      # ======================================================

      - name: Find projects requiring analysis
        run: |
          node scripts/find_art_notice_analysis_queue.js


      # ======================================================
      # Queue 확인
      # ======================================================

      - name: Show analysis queue
        shell: bash

        run: |

          set -euo pipefail

          QUEUE_FILE=".tmp/art_notice_analysis_queue.json"


          if [ ! -f "$QUEUE_FILE" ]; then

            echo "Queue file not found"

            exit 1

          fi


          echo ""
          echo "========================================"
          echo "AXOO AUTO ANALYSIS QUEUE"
          echo "========================================"


          jq . "$QUEUE_FILE"


          echo "========================================"


      # ======================================================
      # STEP 2
      # Queue 안의 프로젝트를 순차 자동 분석
      # ======================================================

      - name: Extract and analyze queued notices
        shell: bash

        run: |

          set -euo pipefail


          QUEUE_FILE=".tmp/art_notice_analysis_queue.json"


          QUEUE_COUNT="$(
            jq -r '.queueCount // 0' "$QUEUE_FILE"
          )"


          echo ""
          echo "Queue count: $QUEUE_COUNT"
          echo ""


          if [ "$QUEUE_COUNT" = "0" ]; then

            echo "분석이 필요한 프로젝트가 없습니다."

            exit 0

          fi


          jq -r \
            '.queue[].researchId' \
            "$QUEUE_FILE" \
          | while read -r research_id
          do


            if [ -z "$research_id" ]; then

              continue

            fi


            export ART_NOTICE_ID="$research_id"


            echo ""
            echo "========================================"
            echo "AUTO ANALYSIS START"
            echo "Research ID: $ART_NOTICE_ID"
            echo "========================================"


            # --------------------------------------------------
            # Google Drive
            # → Apps Script Bridge
            # → HWP / HWPX / PDF
            # --------------------------------------------------

            node scripts/extract_art_notice_attachments.js


            # --------------------------------------------------
            # HWP / HWPX / PDF
            # → Raw Text
            # --------------------------------------------------

            python scripts/extract_art_notice_text.py


            # --------------------------------------------------
            # file:// 런타임 URL 제거
            # --------------------------------------------------

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          if not path.exists():
              raise SystemExit(
                  f"Result not found: {path}"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          data["source"] = (
              "apps_script_bridge"
          )

          data["sourceUrl"] = ""

          for doc in data.get(
              "documents",
              []
          ):

              doc.pop(
                  "url",
                  None
              )

              doc["source"] = (
                  "apps_script_bridge"
              )

          path.write_text(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY


            # --------------------------------------------------
            # Raw Text
            # → Structured Analysis
            # --------------------------------------------------

            python scripts/build_art_notice_analysis.py


            # --------------------------------------------------
            # 결과 검증
            # --------------------------------------------------

            python - <<'PY'
          import json
          import os
          from pathlib import Path

          research_id = os.environ["ART_NOTICE_ID"]

          text_path = (
              Path("data")
              / "art_notice_text"
              / f"{research_id}.json"
          )

          analysis_path = (
              Path("data")
              / "art_notice_analysis"
              / f"{research_id}.json"
          )


          if not text_path.exists():

              raise SystemExit(
                  f"Text result missing: {text_path}"
              )


          if not analysis_path.exists():

              raise SystemExit(
                  f"Analysis result missing: {analysis_path}"
              )


          text_data = json.loads(
              text_path.read_text(
                  encoding="utf-8"
              )
          )


          analysis_data = json.loads(
              analysis_path.read_text(
                  encoding="utf-8"
              )
          )


          document_count = int(
              text_data.get(
                  "documentCount"
              ) or 0
          )


          success_count = int(
              text_data.get(
                  "successCount"
              ) or 0
          )


          if document_count < 1:

              raise SystemExit(
                  "No documents processed"
              )


          if (
              success_count !=
              document_count
          ):

              raise SystemExit(
                  "Document extraction incomplete: "
                  f"{success_count}/"
                  f"{document_count}"
              )


          if (
              analysis_data.get(
                  "status"
              ) !=
              "ok"
          ):

              raise SystemExit(
                  "Analysis status is not OK"
              )


          summary = (
              analysis_data.get(
                  "analysisSummary",
                  {}
              )
          )


          found_count = int(
              summary.get(
                  "foundCount"
              ) or 0
          )


          field_count = int(
              summary.get(
                  "fieldCount"
              ) or 0
          )


          if found_count < 1:

              raise SystemExit(
                  "No structured values detected"
              )


          print("")
          print(
              "========================================"
          )
          print(
              "AUTO ANALYSIS COMPLETE"
          )
          print(
              "Research ID:",
              research_id
          )
          print(
              "Documents:",
              document_count
          )
          print(
              "Fields:",
              found_count,
              "/",
              field_count
          )
          print(
              "========================================"
          )
          PY


            echo ""
            echo "COMPLETE: $ART_NOTICE_ID"
            echo ""


          done


      # ======================================================
      # Runtime 파일 정리
      # ======================================================

      - name: Cleanup runtime files
        if: always()
        shell: bash

        run: |

          rm -rf .tmp


          if git ls-files \
            --error-unmatch \
            data/art_notice_attachments.json \
            >/dev/null 2>&1
          then

            git restore \
              data/art_notice_attachments.json

          else

            rm -f \
              data/art_notice_attachments.json

          fi


      # ======================================================
      # 변경 확인
      # ======================================================

      - name: Check generated data
        id: changes
        shell: bash

        run: |

          if [ -n "$(
            git status \
              --porcelain \
              -- \
              data/art_notice_text \
              data/art_notice_analysis
          )" ]
          then

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

          else

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # 결과 Commit
      # ======================================================

      - name: Commit automatic notice analysis
        if: steps.changes.outputs.changed == 'true'
        shell: bash

        run: |

          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/art_notice_text \
            data/art_notice_analysis


          git commit \
            -m "Auto extract and analyze art notices"


          git pull \
            --rebase \
            origin \
            main


          git push
